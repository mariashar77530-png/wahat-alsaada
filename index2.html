<title>واحة السعادة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Tajawal:wght@400;500;700&family=Amiri+Quran&display=swap">
<style>
/* Layout: sidebar + content on wide screens, bottom tab bar on phones. Soft pastel garden with gold details. */
:root{
  --bg:#FFF8F2; --surface:#FFFFFF; --surface2:#FFF1F6; --line:#F1DEE6;
  --fg:#3B2F40; --muted:#7B6C82;
  --pink:#F8C9DB; --pinkbg:#FDE8F0; --pinkd:#C4457A;
  --lav:#DDD0F6; --lavbg:#F1EBFC; --lavd:#7152B5;
  --mint:#CBEBDC; --mintbg:#E6F6EE; --mintd:#287A5C;
  --gold:#D8B068; --goldbg:#FBF1DA; --goldd:#8E6A1F;
  --shadow:0 6px 24px rgba(160,100,140,.12);
  --font:'Tajawal','Segoe UI',Tahoma,sans-serif; --disp:'Aref Ruqaa','Amiri',serif; --quran:'Amiri Quran','Amiri','Traditional Arabic',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1621; --surface:#2A2231; --surface2:#33283B; --line:#44364D;
  --fg:#F5EBF3; --muted:#BEAEC6;
  --pink:#5A3B4D; --pinkbg:#3C2A38; --pinkd:#F59DBF;
  --lav:#51407A; --lavbg:#322A47; --lavd:#C3ADF5;
  --mint:#2F5A4A; --mintbg:#233B33; --mintd:#8FD9BB;
  --gold:#C9A25A; --goldbg:#3B3222; --goldd:#E8C987;
  --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1621; --surface:#2A2231; --surface2:#33283B; --line:#44364D;
  --fg:#F5EBF3; --muted:#BEAEC6;
  --pink:#5A3B4D; --pinkbg:#3C2A38; --pinkd:#F59DBF;
  --lav:#51407A; --lavbg:#322A47; --lavd:#C3ADF5;
  --mint:#2F5A4A; --mintbg:#233B33; --mintd:#8FD9BB;
  --gold:#C9A25A; --goldbg:#3B3222; --goldd:#E8C987;
  --shadow:0 6px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 12% 8%,var(--pinkbg),transparent 38%),radial-gradient(circle at 92% 30%,var(--lavbg),transparent 40%),radial-gradient(circle at 20% 95%,var(--mintbg),transparent 40%)}
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr;gap:20px;padding-block:14px 96px}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--lavd);outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;line-height:1.4;text-wrap:balance}
h2{font-family:var(--disp);font-size:1.7rem;color:var(--pinkd)}
h3{font-size:1.08rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.88rem}
/* header + nav */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand b{font-family:var(--disp);font-size:1.6rem;color:var(--pinkd);white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.logo{width:44px;height:44px;flex:none}
.side{display:none}
.navlist{display:flex;flex-direction:column;gap:4px}
.navbtn{display:flex;align-items:center;gap:10px;width:100%;text-align:right;background:transparent;border:0;padding:10px 14px;border-radius:14px;color:var(--fg)}
.navbtn:hover{background:var(--pinkbg)}
.navbtn[aria-current="page"]{background:var(--pinkbg);color:var(--pinkd);font-weight:700}
.navbtn .e{width:1.6em;text-align:center}
.bottom{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;
  padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-right,0px))}
.bottom button{flex:1;display:flex;flex-direction:column;align-items:center;gap:0;background:transparent;border:0;padding:4px 2px;font-size:.72rem;color:var(--muted);border-radius:12px;min-width:0}
.bottom button span.e{font-size:1.3rem;line-height:1.3}
.bottom button[aria-current="page"]{color:var(--pinkd);font-weight:700;background:var(--pinkbg)}
@media(min-width:900px){
  #app{grid-template-columns:250px 1fr;align-items:start;padding-block:22px 40px}
  .side{display:block;position:sticky;top:18px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:14px;box-shadow:var(--shadow);max-height:calc(100vh - 36px);overflow:auto}
  .bottom,.moreBtn{display:none}
  .top{display:none}
}
.sidebrand{padding:6px 8px 12px;display:flex;align-items:center;gap:10px}
/* surfaces */
main{min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card.pink{background:var(--pinkbg)} .card.lav{background:var(--lavbg)} .card.mint{background:var(--mintbg)}
.hero{background:linear-gradient(135deg,var(--pinkbg),var(--lavbg));position:relative;overflow:hidden}
.hero .deco{position:absolute;inset-inline-start:-8px;top:-8px;opacity:.55;pointer-events:none}
.hero h1{font-family:var(--disp);font-size:1.9rem;color:var(--pinkd)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.g2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.stack{display:flex;flex-direction:column;gap:12px}
.pagehead{display:flex;flex-direction:column;gap:4px;padding:4px 2px}
.pagehead p{color:var(--muted)}
/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px;font-weight:500;display:inline-flex;gap:6px;align-items:center;justify-content:center;transition:transform .15s,background .15s}
.btn:hover{background:var(--pinkbg)} .btn:active{transform:scale(.97)}
.btn.pri{background:var(--pinkd);border-color:var(--pinkd);color:#fff} .btn.pri:hover{filter:brightness(1.06);background:var(--pinkd)}
.btn.lav{background:var(--lavd);border-color:var(--lavd);color:#fff} .btn.lav:hover{background:var(--lavd);filter:brightness(1.06)}
:root[data-theme="dark"] .btn.pri,:root[data-theme="dark"] .btn.lav{color:#201826}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.pri,:root:not([data-theme="light"]) .btn.lav{color:#201826}}
.btn.sm{padding:4px 12px;font-size:.88rem}
.btn.ghost{background:transparent}
.btn.danger{border-color:#d9768c;color:#b3304f}
:root[data-theme="dark"] .btn.danger{color:#ff9fb3}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.danger{color:#ff9fb3}}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:.92rem}
.chip[aria-pressed="true"],.chip.on{background:var(--lavd);color:#fff;border-color:var(--lavd)}
:root[data-theme="dark"] .chip.on,:root[data-theme="dark"] .chip[aria-pressed="true"]{color:#201826}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on,:root:not([data-theme="light"]) .chip[aria-pressed="true"]{color:#201826}}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:0;background:var(--surface);border:1px solid var(--line);padding:8px 18px;border-radius:999px;font-weight:500}
.tab[aria-selected="true"]{background:var(--pinkd);color:#fff;border-color:var(--pinkd)}
:root[data-theme="dark"] .tab[aria-selected="true"]{color:#201826}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tab[aria-selected="true"]{color:#201826}}
input[type=text],input[type=number],input[type=time],input[type=date],input[type=search],select,textarea{width:100%;font-family:inherit;font-size:1rem;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:9px 12px}
textarea{min-height:110px;resize:vertical;line-height:1.7}
label.l{display:block;font-weight:500;margin-bottom:4px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--pinkd);flex:none}
.sw{display:inline-flex;align-items:center;gap:8px}
.badge{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.78rem;font-weight:500}
.b-rel{background:var(--goldbg);color:var(--goldd);border:1px solid var(--gold)}
.b-app{background:var(--lavbg);color:var(--lavd)}
.b-per{background:var(--mintbg);color:var(--mintd)}
/* religious text */
.rel{background:var(--goldbg);border:1.5px solid var(--gold);border-radius:18px;padding:14px 16px}
.rel .tx{font-family:var(--quran);font-size:1.45rem;line-height:2.1;color:var(--fg)}
.rel .src{color:var(--goldd);font-size:.88rem}
.app-text{background:var(--lavbg);border-radius:18px;padding:14px 16px}
/* progress */
.bar{height:12px;background:var(--pinkbg);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pinkd),var(--lavd));border-radius:99px;transition:width .5s}
.bar.mint{background:var(--mintbg)} .bar.mint i{background:var(--mintd)}
/* moods */
.moods{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.mood{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px;border-radius:20px;border:2px solid transparent;background:var(--pinkbg);font-weight:500}
.mood .em{font-size:2.1rem;line-height:1.2}
.mood:hover{transform:translateY(-2px)}
.mood[aria-pressed="true"]{border-color:var(--pinkd);background:var(--surface)}
.mood.m-sad{background:var(--lavbg)} .mood.m-anx{background:var(--goldbg)} .mood.m-ten{background:var(--pinkbg)} .mood.m-lon{background:var(--lavbg)} .mood.m-gr{background:var(--mintbg)} .mood.m-hap{background:var(--goldbg)}
.sec{display:grid;gap:4px}
.sec h3{color:var(--lavd)}
/* dhikr */
.dk{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.ring{width:86px;height:86px;border-radius:50%;border:0;position:relative;display:grid;place-items:center;font-weight:700;font-size:1.2rem;
  background:conic-gradient(var(--pinkd) calc(var(--p)*1%),var(--pinkbg) 0);color:var(--fg)}
.ring::before{content:"";position:absolute;inset:8px;border-radius:50%;background:var(--surface)}
.ring span{position:relative}
.ring.done{background:conic-gradient(var(--mintd) 100%,var(--mintd) 0)}
.ring small{font-weight:400;font-size:.7rem;display:block;text-align:center;line-height:1}
@media(max-width:520px){.dk{grid-template-columns:1fr}.dk .ring{justify-self:center}}
/* lists */
.task{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--surface2);border:1px solid var(--line)}
.task.done{background:var(--mintbg)}
.task label{flex:1;cursor:pointer;display:flex;align-items:center;gap:10px;min-width:0}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.mini .c{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:.8rem;background:var(--surface2);min-width:0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}
.cal .h{font-size:.75rem;color:var(--muted)}
.cal .d{aspect-ratio:1;border-radius:12px;display:grid;place-items:center;font-size:.82rem;background:var(--surface2);position:relative;min-width:0}
.cal .d.today{outline:2px solid var(--lavd)}
.cal .d .em{font-size:1.2rem;line-height:1}
.l1{background:var(--pinkbg)} .l2{background:var(--pink)} .l3{background:var(--mint)} .l4{background:var(--mintd);color:#fff}
.scroll{overflow-x:auto}
table.wk{border-collapse:separate;border-spacing:4px;width:100%;min-width:420px}
table.wk td,table.wk th{text-align:center;padding:2px;font-size:.82rem}
table.wk td:first-child,table.wk th:first-child{text-align:right;white-space:nowrap;padding-inline-end:8px}
.dot{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--surface2);border:1px solid var(--line)}
.dot.on{background:var(--mintd);border-color:var(--mintd)}
/* flip cards */
.flip{perspective:900px;min-height:200px}
.flip-in{position:relative;width:100%;min-height:200px;transition:transform .6s;transform-style:preserve-3d}
.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:18px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;border:1px solid var(--line);box-shadow:var(--shadow);overflow:auto}
.face.f{background:linear-gradient(145deg,var(--pinkbg),var(--lavbg));font-family:var(--disp);font-size:1.35rem;color:var(--pinkd);cursor:pointer}
.face.b{background:var(--surface);transform:rotateY(180deg);font-size:.98rem}
/* jar */
.jarwrap{display:grid;grid-template-columns:minmax(160px,230px) 1fr;gap:18px;align-items:center}
@media(max-width:620px){.jarwrap{grid-template-columns:1fr;justify-items:center}}
svg .jbody{fill:var(--surface2);stroke:var(--gold);stroke-width:3}
svg .jlid{fill:var(--gold)}
.pop{animation:pop .5s ease both}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
/* breath */
.flower{width:min(260px,70vw);aspect-ratio:1;margin:8px auto;display:grid;place-items:center}
.flower svg{width:100%;height:100%;transform:scale(.55);transition:transform 4s ease-in-out}
.flower .pt{fill:var(--pink);opacity:.8;stroke:var(--pinkd);stroke-width:1}
.flower .pt:nth-child(even){fill:var(--lav);stroke:var(--lavd)}
.flower .ct{fill:var(--gold)}
.phase{text-align:center;font-family:var(--disp);font-size:1.8rem;color:var(--pinkd);min-height:2.6rem}
/* misc */
.fav{background:transparent;border:0;font-size:1.3rem;padding:2px 6px;line-height:1}
.stat{display:flex;flex-direction:column;gap:2px;background:var(--surface2);border-radius:18px;padding:12px 14px}
.stat b{font-size:1.6rem;color:var(--pinkd);font-variant-numeric:tabular-nums;line-height:1.2}
.hbar{display:grid;grid-template-columns:90px 1fr 34px;gap:8px;align-items:center;font-size:.9rem}
.hbar .bar{height:10px}
svg .bk{fill:var(--pinkd)} svg .bk2{fill:var(--mintd)} svg .ax{stroke:var(--line);stroke-width:1} svg text{fill:var(--muted);font-family:var(--font);font-size:9px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 20px;border-radius:999px;box-shadow:var(--shadow);max-width:90vw;text-align:center}
@media(min-width:900px){.toast{bottom:30px}}
.modalbg{position:fixed;inset:0;z-index:50;background:rgba(40,25,45,.5);display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);color:var(--fg);border-radius:24px;padding:22px;max-width:480px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.sheet{align-items:end}
.sheet .modal{border-radius:24px 24px 0 0;max-width:640px;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}
.star{position:fixed;z-index:70;pointer-events:none;font-size:1.3rem;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(1.4);opacity:0}}
.notice{font-size:.85rem;color:var(--muted);text-align:center;padding:10px 8px;border-top:1px dashed var(--line)}
.notice button{background:none;border:0;color:var(--lavd);text-decoration:underline;padding:0}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.fade{animation:fadein .4s ease both}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.daygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px}
.daybtn{aspect-ratio:1;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-weight:700;position:relative}
.daybtn.done{background:var(--mintbg);color:var(--mintd)} .daybtn.sel{border:2px solid var(--pinkd);background:var(--pinkbg)}
.item5{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.item5 .ic{font-size:1.3rem;text-align:center}
.letterlock{opacity:.7}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.flower svg{transition:none!important}}
</style>
<div id="app" dir="rtl" lang="ar">
  <aside class="side" id="side"></aside>
  <div style="display:contents">
    <header class="top" id="top"></header>
    <main id="main"></main>
  </div>
</div>
<nav class="bottom" id="bottom" dir="rtl" aria-label="التنقل السريع"></nav>
<div id="layer" dir="rtl"></div>
<script>
/* ================= البيانات ================= */
const MOODS=[
 {id:'happy',e:'😊',t:'سعيدة',c:'m-hap'},
 {id:'sad',e:'😢',t:'حزينة',c:'m-sad'},
 {id:'anxious',e:'😟',t:'قلقة',c:'m-anx'},
 {id:'tense',e:'😣',t:'متوترة',c:'m-ten'},
 {id:'lonely',e:'🥺',t:'أشعر بالوحدة',c:'m-lon'},
 {id:'grateful',e:'🤍',t:'ممتنة',c:'m-gr'}];

const MOOD_INFO={
happy:{
 msg:'فرحكِ نعمة تستحق أن تُحتفى بها. خذي لحظة وعيشيها بكل قلبك، ولا تخافي من الفرح.',
 why:'السعادة شعور طبيعي وجميل، ومن الجيد أن نلاحظه ونتوقف عنده لأن العقل ينتبه للمتاعب أكثر مما ينتبه للّحظات الحلوة.',
 ex:{t:'اكتبي سبب سعادتك اليوم في سطر، وضعيه في برطمان اللحظات الجميلة ليذكّركِ به في الأيام الثقيلة.',go:'jar',lbl:'افتحي البرطمان'},
 dhikr:{t:'الحمد لله',n:'ما يقوله القلب شكراً عند الفرح.',src:'ذكر عام'},
 dua:{t:'رَبِّ أَوْزِعْنِي أَنْ أَشْكُرَ نِعْمَتَكَ الَّتِي أَنْعَمْتَ عَلَيَّ وَعَلَىٰ وَالِدَيَّ وَأَنْ أَعْمَلَ صَالِحًا تَرْضَاهُ',src:'سورة النمل، الآية ١٩',k:'quran'},
 ibada:'إن أحببتِ: اشكري الله بسجدة شكر أو بكلمات حمد من قلبك، أو تصدّقي بشيء صغير فرحاً بنعمته.',
 prompt:'ما الذي أسعدني اليوم؟ وكيف أحافظ على هذا الشعور؟'},
sad:{
 msg:'حزنكِ مفهوم، ومن حقكِ أن تشعري به. لستِ ضعيفة لأنكِ حزينة، ولا يجب أن تتظاهري بالقوة الآن.',
 why:'الحزن استجابة طبيعية للفقد أو الخذلان أو التعب. حين نسمح له أن يمرّ بدل أن نقاومه، يخفّ بالتدريج.',
 ex:{t:'ضعي يدكِ على صدركِ، وتنفّسي ببطء ثلاث مرات، ثم قولي لنفسك: «أنا هنا معكِ». وإن أحببتِ فاكتبي ما يثقل قلبك.',go:'calm',lbl:'جلسة تنفس'},
 dhikr:{t:'لَا إِلَٰهَ إِلَّا أَنْتَ سُبْحَانَكَ إِنِّي كُنْتُ مِنَ الظَّالِمِينَ',n:'دعاء ذي النون عليه السلام.',src:'سورة الأنبياء ٨٧ · وجاء ذكره في سنن الترمذي'},

/* رحلة ٣٠ يوماً — الآيات: [النص، المرجع، المعنى المبسّط] */
const JV=[
['أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ','سورة الرعد، الآية ٢٨','بذكر الله تسكن القلوب وتهدأ.'],
['فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ۝ إِنَّ مَعَ الْعُسْرِ يُسْرًا','سورة الشرح، الآيتان ٥–٦','مع الضيق يأتي الفرج، فلا تيأسي.'],
['لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا','سورة البقرة، الآية ٢٨٦','الله لا يحمّل أحداً فوق طاقته.'],
['فَاذْكُرُونِي أَذْكُرْكُمْ وَاشْكُرُوا لِي وَلَا تَكْفُرُونِ','سورة البقرة، الآية ١٥٢','اذكري الله يذكركِ، واشكريه على نعمه.'],
['وَإِذَا سَأَلَكَ عِبَادِي عَنِّي فَإِنِّي قَرِيبٌ ۖ أُجِيبُ دَعْوَةَ الدَّاعِ إِذَا دَعَانِ','سورة البقرة، الآية ١٨٦','الله قريب من عباده ويجيب دعاءهم.'],
['قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ ۚ إِنَّ اللَّهَ يَغْفِرُ الذُّنُوبَ جَمِيعًا ۚ إِنَّهُ هُوَ الْغَفُورُ الرَّحِيمُ','سورة الزمر، الآية ٥٣','لا تيأسي من رحمة الله مهما كان الماضي.'],
['وَمَن يَتَوَكَّلْ عَلَى اللَّهِ فَهُوَ حَسْبُهُ ۚ إِنَّ اللَّهَ بَالِغُ أَمْرِهِ ۚ قَدْ جَعَلَ اللَّهُ لِكُلِّ شَيْءٍ قَدْرًا','سورة الطلاق، الآية ٣','من اعتمد على الله كفاه، ولكل شيء وقت وتقدير.'],
['وَلَا تَهِنُوا وَلَا تَحْزَنُوا وَأَنتُمُ الْأَعْلَوْنَ إِن كُنتُم مُّؤْمِنِينَ','سورة آل عمران، الآية ١٣٩','لا تضعفي ولا تحزني، فالإيمان يمنح القوة.'],
['وَلَسَوْفَ يُعْطِيكَ رَبُّكَ فَتَرْضَىٰ','سورة الضحى، الآية ٥','وعد من الله بعطاء يملأ القلب رضاً.'],
['رَبِّ اشْرَحْ لِي صَدْرِي وَيَسِّرْ لِي أَمْرِي','سورة طه، الآيتان ٢٥–٢٦','دعاء موسى عليه السلام ليشرح الله صدره ويسهّل أمره.'],
['لَا تَحْزَنْ إِنَّ اللَّهَ مَعَنَا','سورة التوبة، الآية ٤٠','قالها النبي ﷺ لصاحبه في الغار: الله معنا.'],
['إِنَّنِي مَعَكُمَا أَسْمَعُ وَأَرَىٰ','سورة طه، الآية ٤٦','قال الله لموسى وهارون: أنا معكما أسمع وأرى.'],
['لَئِن شَكَرْتُمْ لَأَزِيدَنَّكُمْ','سورة إبراهيم، الآية ٧','الشكر سبب لزيادة النعم.'],
['وَرَحْمَتِي وَسِعَتْ كُلَّ شَيْءٍ','سورة الأعراف، الآية ١٥٦','رحمة الله تشمل كل شيء.'],
['إِنَّمَا أَشْكُو بَثِّي وَحُزْنِي إِلَى اللَّهِ وَأَعْلَمُ مِنَ اللَّهِ مَا لَا تَعْلَمُونَ','سورة يوسف، الآية ٨٦','قالها يعقوب عليه السلام: أشكو همّي وحزني لله وحده.'],
['يَا أَيُّهَا الَّذِينَ آمَنُوا اسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ ۚ إِنَّ اللَّهَ مَعَ الصَّابِرِينَ','سورة البقرة، الآية ١٥٣','استعيني بالصبر والصلاة، فالله مع الصابرين.'],
['حَسْبُنَا اللَّهُ وَنِعْمَ الْوَكِيلُ','سورة آل عمران، الآية ١٧٣','الله كافينا ونعم المعتمَد عليه.'],
['لَّا إِلَٰهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ','سورة الأنبياء، الآية ٨٧','دعاء يونس عليه السلام في الظلمات.'],
['وَنَحْنُ أَقْرَبُ إِلَيْهِ مِنْ حَبْلِ الْوَرِيدِ','سورة ق، الآية ١٦','الله أقرب إلينا من أنفسنا.'],
['وَعَسَىٰ أَن تَكْرَهُوا شَيْئًا وَهُوَ خَيْرٌ لَّكُمْ ۖ وَعَسَىٰ أَن تُحِبُّوا شَيْئًا وَهُوَ شَرٌّ لَّكُمْ ۗ وَاللَّهُ يَعْلَمُ وَأَنتُمْ لَا تَعْلَمُونَ','سورة البقرة، الآية ٢١٦','قد يكون في ما نكرهه خير لا نعلمه.'],
['وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا','سورة الطلاق، الآية ٢','من اتقى الله جعل له مخرجاً.'],
['سَيَجْعَلُ اللَّهُ بَعْدَ عُسْرٍ يُسْرًا','سورة الطلاق، الآية ٧','بعد الضيق يأتي اليسر بإذن الله.'],
['إِنَّ اللَّهَ مَعَ الَّذِينَ اتَّقَوْا وَّالَّذِينَ هُم مُّحْسِنُونَ','سورة النحل، الآية ١٢٨','الله مع المتقين والمحسنين.'],
['أَلَا إِنَّ أَوْلِيَاءَ اللَّهِ لَا خَوْفٌ عَلَيْهِمْ وَلَا هُمْ يَحْزَنُونَ','سورة يونس، الآية ٦٢','أولياء الله لا خوف عليهم ولا هم يحزنون.'],
['وَقَالَ رَبُّكُمُ ادْعُونِي أَسْتَجِبْ لَكُمْ','سورة غافر، الآية ٦٠','ادعي الله، فقد وعد بالاستجابة.'],
['يَا أَيُّهَا الَّذِينَ آمَنُوا اذْكُرُوا اللَّهَ ذِكْرًا كَثِيرًا','سورة الأحزاب، الآية ٤١','أكثري من ذكر الله.'],
['فَإِذَا عَزَمْتَ فَتَوَكَّلْ عَلَى اللَّهِ ۚ إِنَّ اللَّهَ يُحِبُّ الْمُتَوَكِّلِينَ','سورة آل عمران، الآية ١٥٩','خذي بالأسباب ثم توكلي على الله.'],
['وَقُل رَّبِّ زِدْنِي عِلْمًا','سورة طه، الآية ١١٤','اطلبي من الله أن يزيدكِ علماً وفهماً.'],
['رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا وَهَبْ لَنَا مِن لَّدُنكَ رَحْمَةً ۚ إِنَّكَ أَنتَ الْوَهَّابُ','سورة آل عمران، الآية ٨','دعاء بالثبات على الهداية وطلب الرحمة.'],
['رَبِّ إِنِّي لِمَا أَنزَلْتَ إِلَيَّ مِنْ خَيْرٍ فَقِيرٌ','سورة القصص، الآية ٢٤','دعاء موسى عليه السلام: يا رب أنا محتاج لخيرك.']
];

/* ===== مواقيت الصلاة (حساب فلكي تقريبي، دون إنترنت) ===== */
const RD=Math.PI/180,sinD=d=>Math.sin(d*RD),cosD=d=>Math.cos(d*RD),tanD=d=>Math.tan(d*RD),asinD=x=>Math.asin(x)/RD,acosD=x=>Math.acos(x)/RD,atan2D=(y,x)=>Math.atan2(y,x)/RD,acotD=x=>Math.atan(1/x)/RD;
const fixN=(a,b)=>{a=a-b*Math.floor(a/b);return a<0?a+b:a},fixA=a=>fixN(a,360),fixH=a=>fixN(a,24);
function julian(y,m,d){if(m<=2){y-=1;m+=12}const A=Math.floor(y/100),B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5}
function sunPos(jd){const D=jd-2451545.0,g=fixA(357.529+0.98560028*D),q=fixA(280.459+0.98564736*D),L=fixA(q+1.915*sinD(g)+0.02*sinD(2*g)),e=23.439-0.00000036*D,RA=fixH(atan2D(cosD(e)*sinD(L),cosD(L))/15);return{decl:asinD(sinD(e)*sinD(L)),eqt:q/15-RA}}
function tzOff(c,d){try{const s=new Intl.DateTimeFormat('en-US',{timeZone:c.tz,timeZoneName:'longOffset'}).formatToParts(d).find(p=>p.type==='timeZoneName').value;const m=/GMT([+-])(\d\d):?(\d\d)?/.exec(s);if(!m)return c.tz0;return(m[1]==='-'?-1:1)*(+m[2]+(+m[3]||0)/60)}catch(e){return c.tz0}}
function cityNow(c){try{const p=new Intl.DateTimeFormat('en-GB',{timeZone:c.tz,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date()),g=t=>p.find(x=>x.type===t).value;return{date:g('year')+'-'+g('month')+'-'+g('day'),h:+g('hour')%24,m:+g('minute')}}catch(e){const n=new Date();return{date:dkey(n),h:n.getHours(),m:n.getMinutes()}}}
function prayerTimes(c,key){const dt=pk(key),jd=julian(dt.getFullYear(),dt.getMonth()+1,dt.getDate())-c.lng/360,M=METHODS[c.m]||METHODS.mwl;
 const mid=t=>fixH(12-sunPos(jd+t).eqt);
 const sa=(ang,t,ccw)=>{const p=sunPos(jd+t),v=acosD((-sinD(ang)-sinD(p.decl)*sinD(c.lat))/(cosD(p.decl)*cosD(c.lat)))/15;return mid(t)+(ccw?-v:v)};
 const asr=t=>{const p=sunPos(jd+t);return sa(-acotD(1+tanD(Math.abs(c.lat-p.decl))),t)};
 let t={fajr:5,sunrise:6,dhuhr:12,asr:13,maghrib:18,isha:18};
 for(let i=0;i<2;i++){const q={};for(const k in t)q[k]=t[k]/24;
  t={fajr:sa(M.fajr,q.fajr,true),sunrise:sa(0.833,q.sunrise,true),dhuhr:mid(q.dhuhr),asr:asr(q.asr),maghrib:sa(0.833,q.maghrib),isha:0};
  t.isha=M.ishaMin?t.maghrib+M.ishaMin/60:sa(M.isha,q.isha)}
 const sh=tzOff(c,new Date(dt.getFullYear(),dt.getMonth(),dt.getDate(),12))-c.lng/15;const out={};
 for(const k in t){out[k]=t[k]+sh}out.dhuhr+=1/60;return out}
function fmtT(h){if(!isFinite(h))return'—';h=fixH(h+0.5/60);return ar(pad(Math.floor(h))+':'+pad(Math.floor((h-Math.floor(h))*60)))}
function hm(h){h=fixH(h+0.5/60);return pad(Math.floor(h))+':'+pad(Math.floor((h-Math.floor(h))*60))}

function startBreath(){
 stopTimers();const pat=BREATH.find(b=>b[0]===(U.bp||'calm')),dur=+($('#bdur')||{value:60}).value,fl=$('#flsvg'),ph=$('#phase'),sub=$('#phsub');let left=dur,inh=true;
 const cycle=()=>{if(left<=0){ph.textContent='أحسنتِ 🌸';sub.textContent='لاحظي كيف تشعرين الآن، وخذي وقتكِ.';fl.style.transition='transform 2s';fl.style.transform='scale(.7)';return}
  const secs=inh?pat[2]:pat[3];fl.style.transition=`transform ${secs}s ease-in-out`;fl.style.transform=inh?'scale(1)':'scale(.55)';ph.textContent=inh?'شهيق… 🌬️':'زفير… 🍃';let c=secs;sub.textContent=`${ar(c)}`;
  const iv=every(()=>{c--;left--;if(c>0)sub.textContent=ar(c)},1000);later(()=>{clearInterval(iv);inh=!inh;cycle()},secs*1000)};
 requestAnimationFrame(cycle);
}
function startPmr(){stopTimers();const ph=$('#phase'),sub=$('#phsub'),pb=$('#pbar');let i=0;
 const step=()=>{if(i>=PMR.length){ph.textContent='أحسنتِ 🌿';sub.textContent='استشعري الراحة في جسدكِ كله.';pb.style.width='100%';return}
  const g=PMR[i];pb.style.width=(i/PMR.length*100)+'%';ph.textContent=g[0];sub.textContent=g[1]+' لمدة ٥ ثوانٍ…';
  later(()=>{sub.textContent='الآن أرخي… وتنفّسي بهدوء (١٠ ثوانٍ)';later(()=>{i++;step()},10000)},5000)};step()}
function startPause(){stopTimers();const ph=$('#phase'),sub=$('#phsub');let t=180;const lines=['اجلسي بوضع مريح، وأرخي كتفيك…','تنفّسي ببطء، لا شيء مطلوب منكِ الآن.','يمكنكِ أن تقولي في قلبكِ: «الحمد لله، وحسبي الله».','ما يشغلكِ سيبقى مكانه، وأنتِ تستريحين قليلاً.','شعوركِ مفهوم، وأنتِ بخير في هذه اللحظة.','لحظات وتعودين أهدأ بإذن الله.'];

  <label class="l" for="imp">استعادة من نسخة احتياطية</label><textarea id="imp" placeholder="الصقي النص هنا…" style="min-height:90px;direction:ltr" data-input="imp"></textarea>
  <div class="row"><button class="btn lav" data-act="importData">استعادة</button><label class="btn">اختيار ملف<input type="file" accept=".json,application/json" id="impf" style="display:none"></label></div></div>
 <div class="card stack"><h3>حذف كل بياناتي 🗑️</h3><p class="muted small">سيُحذف كل ما كتبتِه وسجّلتِه نهائياً من هذا الجهاز. لا يمكن التراجع، فنصيحتنا أخذ نسخة احتياطية أولاً.</p><div><button class="btn danger" data-act="wipe">حذف كل شيء…</button></div></div>
 <div class="card stack"><h3>عن واحة السعادة 🌷</h3><p>«اعتني بقلبكِ، اقتربي من الله، ولا تنسي أنكِ تستحقين الرحمة والرفق، حتى من نفسكِ».</p><p class="muted small">الفلسفة: الرحمة قبل الإنجاز، والتشجيع بدلاً من اللوم. لا نقاط تُخصم، ولا إنجازات تُصفَّر، ولا مقارنة بين أحد. وجميع النصوص الدينية مأخوذة مع ذكر مصدرها، ولا ننسب إلى النبي ﷺ شيئاً دون مصدر. يُنصح بمراجعة أهل العلم لأي استفسار شرعي. التطبيق ليس بديلاً عن الطبيب أو المعالج النفسي.</p><div><button class="btn" data-act="help">هل تحتاجين مساعدة الآن؟</button></div></div>`}

const VIEWS={home:vHome,mood:vMood,qurb:vQurb,worship:vWorship,message:vMessage,journey:vJourney,jar:vJar,affirm:vAffirm,calm:vCalm,challenges:vChall,journal:vJournal,reminders:vRem,stats:vStats,settings:vSettings};

/* ================= الرسم والتنقل ================= */
function chrome(){
 const logo=`<svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="var(--pinkbg)"/><path d="M38 12a20 20 0 1 0 14 34A16 16 0 0 1 38 12z" fill="var(--gold)"/><circle cx="46" cy="18" r="2.4" fill="var(--pinkd)"/><path d="M20 44c4-8 8-8 12 0" stroke="var(--mintd)" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
 const nav=ROUTES.map(r=>`<button class="navbtn" data-go="${r.id}" ${U.route===r.id?'aria-current="page"':''}><span class="e">${r.e}</span>${r.t}</button>`).join('');
 $('#side').innerHTML=`<div class="sidebrand">${logo}<div class="brand"><div><b>واحة السعادة</b><small>رفيقتكِ النفسية والإيمانية</small></div></div></div><nav class="navlist" aria-label="الأقسام">${nav}</nav>`;
 $('#top').innerHTML=`<div class="brand">${logo}<div><b>واحة السعادة</b><small>رفيقتكِ النفسية والإيمانية</small></div></div>`;
 const main=['home','mood','qurb','worship'];
 $('#bottom').innerHTML=main.map(id=>`<button data-go="${id}" ${U.route===id?'aria-current="page"':''}><span class="e">${rt(id).e}</span>${rt(id).t.split(' ')[0]}</button>`).join('')+`<button class="moreBtn" data-act="more" ${main.includes(U.route)?'':'aria-current="page"'}><span class="e">🌺</span>المزيد</button>`;
}
function render(keepScroll=true){
 const y=window.scrollY;stopTimers();U.route=routeNow();chrome();
 let html;try{html=VIEWS[U.route]()}catch(e){console.error(e);html='<div class="card">حدث خطأ بسيط في عرض هذه الصفحة. جرّبي العودة للرئيسية.</div>'}
 $('#main').innerHTML=html;document.title='واحة السعادة';
 if(keepScroll)window.scrollTo(0,y);
}
function go(id,opts={}){if(opts.cat){U.cat=opts.cat;U.qTab='athkar'}if(location.hash==='#'+id){render(false);window.scrollTo(0,0)}else{location.hash=id}}
window.addEventListener('hashchange',()=>{render(false);window.scrollTo(0,0)});

/* ================= الأحداث ================= */
document.addEventListener('click',e=>{
 const g=e.target.closest('[data-go]');if(g){e.preventDefault();closeModal();go(g.dataset.go,{cat:g.dataset.cat});return}
 const el=e.target.closest('[data-act]');if(!el)return;
 const a=el.dataset.act,id=el.dataset.id,key=TODAY();
 const R=()=>render(true);
 switch(a){
 case'closeModalBg':if(e.target===el)closeModal();break;
 case'closeModal':closeModal();break;
 case'confirmYes':{const f=U.onYes;closeModal();f&&f();break}
 case'help':help();break;
 case'more':modal(`<h3>كل الأقسام 🌺</h3><div class="navlist">${ROUTES.map(r=>`<button class="navbtn" data-go="${r.id}"><span class="e">${r.e}</span>${r.t}</button>`).join('')}</div>`,{sheet:true});break;
 case'dismissWelcome':U.welcome=false;R();break;
 case'favMsg':{const i=+id;S.favMsgs=S.favMsgs.includes(i)?S.favMsgs.filter(x=>x!==i):[...S.favMsgs,i];save();R();break}
 case'favAff':{const i=+id;S.favAff=S.favAff.includes(i)?S.favAff.filter(x=>x!==i):[...S.favAff,i];save();R();break}
 case'copy':copyText(el.dataset.t);break;
 case'pickMood':{const last=S.moods[S.moods.length-1];if(!(last&&last.date===key&&last.mood===id&&Date.now()-last.ts<600000)){S.moods.push({id:uid(),ts:Date.now(),date:key,mood:id});save()}U.moodSel=id;U.moodNote='';if(U.route!=='mood')location.hash='mood';else R();window.scrollTo(0,0);break}
 case'saveMoodNote':{const t=($('#moodNote')||{}).value||'';if(!t.trim()){toast('اكتبي ما تشعرين به أولاً 🌷');break}S.journal.push({id:uid(),ts:Date.now(),type:'مشاعر',text:(moodBy(U.moodSel).e+' '+moodBy(U.moodSel).t+'\n')+t.trim()});save();U.moodNote='';toast('حُفظ في دفترك الخاص 🌸');checkCrisis(t);R();break}
 case'moodTab':U.moodTab=id;R();break;
 case'moodMonth':{const b=U.moodMonth?new Date(U.moodMonth+'-01T00:00:00'):new Date();b.setMonth(b.getMonth()+(+id));U.moodMonth=b.getFullYear()+'-'+pad(b.getMonth()+1);R();break}
 case'qTab':U.qTab=id;R();break;
 case'cat':U.cat=id;R();break;
 case'dcat':U.dcat=id;R();break;
 case'tick':{S.dhikr[key]=S.dhikr[key]||{};const it=ATHKAR[id.split(':')[0]].items[+id.split(':')[1]],tg=S.targets[id]||it[1];const n=(S.dhikr[key][id]||0)+1;S.dhikr[key][id]=n;save();
  const card=document.querySelector(`[data-card="${id}"] .ring`);if(card){card.style.setProperty('--p',Math.min(100,Math.round(n/tg*100)));card.classList.toggle('done',n>=tg);card.querySelector('b').textContent=ar(n);if(n===tg){toast('تقبّل الله منكِ 🤍');sparkleEl(card)}}break}
 case'resetCnt':if(S.dhikr[key])delete S.dhikr[key][id];save();R();break;
 case'saveLast':{const s=+$('#qs').value;let ay=Math.max(1,Math.min(SURAHS[s-1][1],+$('#qa').value||1));S.quran.s=s;S.quran.a=ay;save();toast('حُفظ موضعكِ 📍');R();break}
 case'setLast':{S.quran.s=+id;S.quran.a=1;save();toast('تم تعيين سورة '+SURAHS[id-1][0]+' كموضع لكِ 📍');R();break}
 case'wirdToday':{const on=!S.quran.log[key];if(on)S.quran.log[key]=true;else delete S.quran.log[key];setW(key,'quran',on);if(on){toast('ما شاء الله، تقبّل الله منكِ 📖');}save();R();break}
 case'read':U.reader=+id;R();break;
 case'closeReader':U.reader=null;R();break;
 case'addDua':{const t=(U.newDua||'').trim();if(!t)break;S.myDuas.unshift({id:uid(),t});U.newDua='';save();R();break}
 case'delDua':S.myDuas=S.myDuas.filter(d=>d.id!==id);save();R();break;
 case'wTab':U.wTab=id;R();break;
 case'wManage':U.wManage=!U.wManage;R();break;
 case'wMonth':{const b=U.wMonth?new Date(U.wMonth+'-01T00:00:00'):new Date();b.setMonth(b.getMonth()+(+id));U.wMonth=b.getFullYear()+'-'+pad(b.getMonth()+1);R();break}
 case'toggleW':{const on=!wDone(key,id);setW(key,id,on);if(on)toast('بارك الله فيكِ 🌸');R();if(on){const t=document.querySelector(`[data-act="toggleW"][data-id="${id}"]`);sparkleEl(t)}break}
 case'toggleVis':{const h=S.wt.hidden;S.wt.hidden=h.includes(id)?h.filter(x=>x!==id):[...h,id];save();R();break}
 case'addTask':{const v=($('#newTask').value||'').trim();if(!v)break;S.wt.custom.push({id:'c'+uid(),t:v});save();R();break}
 case'delTask':S.wt.custom=S.wt.custom.filter(c=>c.id!==id);save();R();break;
 case'nextMsg':{let n;do{n=Math.floor(Math.random()*MSGS.length)}while(n===U.msgIdx&&MSGS.length>1);U.msgIdx=n;R();break}
 case'todayMsg':U.msgIdx=null;R();break;
 case'topic':U.msgTopic=id;R();break;
 case'shareMsg':shareText('«'+MSGS[+id][1]+'»');break;
 case'jday':U.jDay=+id;R();window.scrollTo({top:0,behavior:'smooth'});break;
 case'jitem':{const sel=U.jDay||currentJourneyDay();S.journey.items[sel]=S.journey.items[sel]||{};S.journey.items[sel][id]=el.checked;save();break}
 case'jdone':{const sel=U.jDay||currentJourneyDay();if(S.journey.done[sel])delete S.journey.done[sel];else{S.journey.done[sel]=true;toast('أتممتِ اليوم '+ar(sel)+' 🌸 بارك الله فيكِ');setTimeout(()=>sparkle(innerWidth/2,innerHeight/2,12),50)}save();U.jDay=null;R();break}
 case'jtype':U.jarDraft.type=id;R();break;
 case'addJar':{const t=(U.jarDraft.text||'').trim();if(!t){toast('اكتبي ذكراكِ أولاً 🌷');break}S.jar.push({id:uid(),ts:Date.now(),type:U.jarDraft.type,text:t});U.jarDraft.text='';save();toast('أُضيفت إلى البرطمان 🌟');R();sparkle(innerWidth/2,200,10);break}
 case'drawJar':{const p=S.jar[Math.floor(Math.random()*S.jar.length)];U.jarPick=p.id;R();break}
 case'delJar':S.jar=S.jar.filter(m=>m.id!==id);if(U.jarPick===id)U.jarPick=null;save();R();break;
 case'flip':{U.flip[id]=!U.flip[id];const f=document.querySelector(`[data-flip="${id}"]`);if(f)f.classList.toggle('on',U.flip[id]);break}
 case'affFav':U.affFav=id==='1';R();break;
 case'shareAff':shareText('«'+AFFIRM[+id][0]+'»\n'+AFFIRM[+id][1]);break;
 case'calm':U.calm=id;R();window.scrollTo(0,0);break;
 case'bpat':U.bp=id;R();break;
 case'bstart':startBreath();break;
 case'pstart':startPmr();break;
 case'qstart':startPause();break;
 case'bstop':stopTimers();R();break;
 case'wrNext':U.wr.pi++;U.wr.text=($('#wrText')||{}).value||'';R();break;
 case'wrSave':{const t=(U.wr.text||'').trim();if(!t){toast('اكتبي شيئاً أولاً 🌷');break}S.journal.push({id:uid(),ts:Date.now(),type:'تفريغ',text:WRITE_PROMPTS[U.wr.pi%WRITE_PROMPTS.length]+'\n'+t});save();U.wr.text='';toast('حُفظ في دفتركِ 🌸');checkCrisis(t);R();break}
 case'thNext':U.th.a[U.th.step]=($('#thText')||{}).value||'';U.th.step++;R();break;
 case'thPrev':U.th.a[U.th.step]=($('#thText')||{}).value||'';U.th.step--;R();break;
 case'thSave':{U.th.a[3]=($('#thText')||{}).value||'';const txt=THOUGHT_Q.map((q,i)=>q+'\n'+(U.th.a[i]||'—')).join('\n\n');S.journal.push({id:uid(),ts:Date.now(),type:'تفريغ',text:txt});save();checkCrisis(txt);U.th={step:0,a:[]};toast('حُفظ في دفتركِ، وأنتِ بخير 🌤️');U.calm='menu';R();break}
 case'chall':{S.ch[key]=S.ch[key]||{};if(S.ch[key][id])delete S.ch[key][id];else{S.ch[key][id]=true;toast('+٥ نقاط بهجة ✨');}save();R();if(S.ch[key][id])sparkleEl(document.querySelector(`[data-act="chall"][data-id="${id}"]`));break}
 case'addJournal':{const t=(U.jd.text||'').trim();if(!t){toast('اكتبي شيئاً أولاً 🌷');break}const e2={id:uid(),ts:Date.now(),type:U.jd.type,text:t};if(U.jd.type==='رسالة لنفسي في المستقبل'){if(!U.jd.open){toast('اختاري تاريخاً لفتح الرسالة 📅');break}e2.open=U.jd.open}S.journal.push(e2);save();checkCrisis(t);U.jd.text='';toast('حُفظت تدوينتكِ 🌸');R();break}
 case'delJournal':U.confirmDel=id;R();break;
 case'delJournalNo':U.confirmDel=null;R();break;
 case'delJournalYes':S.journal=S.journal.filter(x=>x.id!==id);U.confirmDel=null;save();R();break;
 case'remOn':{S.rem.on[id]=el.checked;save();if(el.checked)toast('تم تفعيل التذكير 🔔');break}
 case'remPray':S.rem.prayers.on=el.checked;save();break;
 case'notifOn':try{Notification.requestPermission().then(()=>R())}catch(err){toast('لا يدعم هذا العرض الإشعارات')}break;
 case'theme':S.theme=id;save();applyTheme();R();break;
 case'exportData':U.backup=JSON.stringify(S);R();break;
 case'dlData':try{const b=new Blob([U.backup],{type:'application/json'}),u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download='wahat-alsaada-backup.json';document.body.appendChild(l);l.click();l.remove();toast('إن لم يبدأ التنزيل فاستخدمي «نسخ النص»')}catch(err){toast('استخدمي «نسخ النص» وخزّنيه في مكان آمن')}break;
 case'importData':{const t=($('#imp')||{}).value||'';importJSON(t);break}
 case'wipe':ask('هل تريدين حذف كل بياناتكِ نهائياً من هذا الجهاز؟ لا يمكن التراجع عن ذلك.',()=>{S=defaults();try{localStorage.removeItem(LSK)}catch(e){}memStore=null;save();U.backup='';toast('تم حذف كل البيانات');location.hash='home';render(false)},'نعم، احذفي كل شيء');break;
 }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.face.f')){e.preventDefault();e.target.click()}if(e.key==='Escape')closeModal()});
document.addEventListener('input',e=>{const el=e.target,k=el.dataset&&el.dataset.input;if(!k)return;const v=el.value,id=el.dataset.id;
 switch(k){
 case'name':S.name=v;save();break;
 case'surQ':U.surQ=v;{const pos=el.selectionStart;render();const n=$('#surQ');if(n){n.focus();n.setSelectionRange(pos,pos)}}break;
 case'journalQ':U.journalQ=v;{const pos=el.selectionStart;render();const n=$('#jq');if(n){n.focus();n.setSelectionRange(pos,pos)}}break;
 case'jtext':U.jd.text=v;break;
 case'jarText':U.jarDraft.text=v;break;
 case'wrText':U.wr.text=v;break;
 case'thText':U.th.a[U.th.step]=v;break;
 case'newDua':U.newDua=v;break;
 case'target':{const n=Math.max(1,Math.min(1000,+v||1));S.targets[id]=n;save();break}
 case'goal':S.wt.goals[id]=Math.max(0,Math.min(7,+v||0));save();break;
 case'weekGoal':S.quran.weekGoal=Math.max(1,Math.min(7,+v||1));save();break;
 case'pages':S.quran.pages=Math.max(1,Math.min(40,+v||1));save();break;
 case'remTime':S.rem.time[id]=v;save();break;
 }});
document.addEventListener('change',e=>{const el=e.target,k=el.dataset&&el.dataset.input;
 if(el.id==='impf'&&el.files[0]){const r=new FileReader();r.onload=()=>importJSON(String(r.result));r.readAsText(el.files[0]);return}
 if(!k)return;
 switch(k){
 case'jtype':U.jd.type=el.value;render();break;
 case'jopen':U.jd.open=el.value;break;
 case'wirdOn':S.quran.wirdOn=el.checked;save();render();break;
 case'target':case'goal':case'weekGoal':case'pages':render();break;
 case'city':S.rem.city=el.value;save();render();break;
 }});
document.addEventListener('change',e=>{if(e.target.id==='qs'){const s=+e.target.value;const n=$('#qa');n.max=SURAHS[s-1][1];n.value=1}});
function importJSON(t){try{const o=JSON.parse(t);if(!o||typeof o!=='object'||o.v!==1)throw 0;S=Object.assign(defaults(),o);save();applyTheme();toast('تمت استعادة بياناتكِ 🌸');location.hash='home';render(false)}catch(e){toast('تعذّرت الاستعادة، تأكدي أن النص نسخة صحيحة من واحة السعادة')}}
function applyTheme(){const r=document.documentElement;if(S.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',S.theme)}

/* ================= تذكيرات داخل التطبيق ================= */
function fire(id,msg){const k=TODAY()+':'+id+':'+msg;if(S.rem.fired[k])return;S.rem.fired[k]=true;const keys=Object.keys(S.rem.fired);if(keys.length>80)keys.slice(0,40).forEach(x=>delete S.rem.fired[x]);save();toast('🔔 '+msg);try{if('Notification' in window&&Notification.permission==='granted')new Notification('واحة السعادة',{body:msg})}catch(e){}}
function tickRem(){
 const n=new Date(),cur=pad(n.getHours())+':'+pad(n.getMinutes());
 REMS.forEach(r=>{if(!S.rem.on[r[0]])return;if(r[0]==='water'){if(n.getHours()>=10&&n.getHours()<=20&&n.getHours()%2===0&&n.getMinutes()===0)fire('water',REM_TEXT.water+' '+n.getHours());return}if((S.rem.time[r[0]]||r[3])===cur)fire(r[0],REM_TEXT[r[0]])});
 if(S.rem.prayers.on){const c=getCity(),cn=cityNow(c),pt=prayerTimes(c,cn.date),cc=pad(cn.h)+':'+pad(cn.m);PRAYERS.forEach(p=>{if(p[0]!=='sunrise'&&hm(pt[p[0]])===cc)fire('p'+p[0],'حان وقت صلاة '+p[1]+' 🕌')})}}

/* ================= الإقلاع ================= */
(function boot(){
 applyTheme();
 const t=TODAY();
 if(S.lastVisit){const gap=Math.round((pk(t)-pk(S.lastVisit))/864e5);if(gap>=3)U.welcome=true}
 S.lastVisit=t;save();
 render(false);
 setInterval(tickRem,20000);setTimeout(tickRem,1500);
})();
</script>
